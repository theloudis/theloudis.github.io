<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Text encoding and mobile scaling -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Browser tab title -->
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <!-- Loads the Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Loads the icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Loads the CSS style -->
    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>

  <body>
    <!-- Centers the page content -->
    <div class="wrapper">
      <!-- Top of the page -->
      <header class="site-header">
        <!-- Site title and subtitle -->
        <h1 class="site-title">{{ site.title }}</h1>
        <p class="site-subtitle">Tilburg University</p>
        
        <!-- Menu bar -->
        <nav class="nav-bar">
          <!-- Menu links from CSS site settings -->
          <div class="nav-links">
            {% for link in site.navbar_links %}
              <a href="{{ link[1] | relative_url }}" 
                 class="nav-item {% if page.url == link[1] %}active{% endif %}"
                 {% if link[1] contains '.pdf' %}target="_blank"{% endif %}>
                {{ link[0] }}
              </a>
            {% endfor %}
          </div>

          <!-- Contact and profile icons -->
          <div class="nav-icons">
            <a href="mailto:a.theloudis@gmail.com" aria-label="Email">
              <i class="fa-solid fa-envelope"></i>
            </a>
            <a href="https://scholar.google.com/citations?user=xA-P3JgAAAAJ&hl=en" target="_blank" rel="noopener" aria-label="Google Scholar">
              <i class="fa-solid fa-graduation-cap"></i>
            </a>
            <a href="https://x.com/AlexTheloudis" target="_blank" rel="noopener" aria-label="Twitter">
              <i class="fa-brands fa-twitter"></i>
            </a>
            <a href="https://github.com/theloudis" target="_blank" rel="noopener" aria-label="GitHub">
              <i class="fa-brands fa-square-github"></i>
            </a>
          </div>
        </nav>
      </header>

      <main class="content">
        {{ content }}
      </main>
    </div>
  </body>
</html>
